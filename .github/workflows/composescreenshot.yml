# Workflow name
name: Compose Preview Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'

      - name: Install GraalJS Standalone (JVM version)
        run: |
          mkdir graaljs
          curl -sL https://github.com/oracle/graaljs/releases/download/graal-24.1.2/graaljs-community-jvm-24.1.2-linux-amd64.tar.gz | tar -xz -C graaljs --strip-components=1
          echo "$PWD/graaljs/bin" >> $GITHUB_PATH

      - name: Generate HTML using GraalJS
        working-directory: ui/PreviewScreenshot/app/src/main/java/com/example/compose/previewscreenshot/
        run: |
          # The --jvm flag is removed because this launcher is already JVM-based
          js --polyglot generateHtml.js > generated.html
          mkdir -p ${{ github.workspace }}/ui/PreviewScreenshot/app/src/main/res/raw
          mv generated.html ${{ github.workspace }}/ui/PreviewScreenshot/app/src/main/res/raw/generated.html

      - name: Build project and run screenshot tests
        working-directory: ui/PreviewScreenshot
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew updateDebugScreenshotTest
          ./gradlew validateDebugScreenshotTest
          ls -R .

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .
